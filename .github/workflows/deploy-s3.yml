# Deploy estático para S3 + invalidação CloudFront.
# Secrets necessários no repositório:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   S3_BUCKET
#   CLOUDFRONT_DISTRIBUTION_ID

name: Deploy to S3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 sync . "s3://${S3_BUCKET}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "_source.html" \
            --exclude "*.md"

          # HTML/CSS/JS com cache curto (invalidação no CloudFront cobre o resto)
          aws s3 cp index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "public,max-age=300" \
            --content-type "text/html; charset=utf-8"

          aws s3 cp css/styles.css "s3://${S3_BUCKET}/css/styles.css" \
            --cache-control "public,max-age=300" \
            --content-type "text/css; charset=utf-8"

          aws s3 cp js/main.js "s3://${S3_BUCKET}/js/main.js" \
            --cache-control "public,max-age=300" \
            --content-type "application/javascript; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
